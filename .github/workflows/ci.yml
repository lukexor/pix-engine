---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  format:
    name: Check format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: cargo fmt --all --check

  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        toolchain: [stable, 1.92.0]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `cpal` and `gilrs` build against these. `wgpu` and `winit` pick their backends at runtime.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev
      - run: cargo clippy
      - name: Build
        shell: bash
        run: |
          cargo build --all-targets --features "serde" --verbose
          # TODO: Enable when WASM development begins
          # bin/build_wasm.sh --dev
      - run: cargo doc --features "serde" --verbose
      - run: cargo test --features "serde" --verbose
