[package]
authors = ["Luke Petherbridge <me@lukeworks.tech>"]
categories = [
  "game-development",
  "game-engines",
  "graphics",
  "gui",
  "rendering",
]
description = "A cross-platform graphics/UI engine framework for simple games, visualizations, and graphics demos."
documentation = "https://docs.rs/pix-engine"
edition = "2021"
keywords = ["game", "engine", "graphics", "ui", "rendering"]
license = "MIT OR Apache-2.0"
name = "pix-engine"
repository = "https://github.com/lukexor/pix-engine.git"
resolver = "2"
rust-version = "1.92.0"
version = "0.8.0"
exclude = ["/images", "/audio", "/pkg"]

[package.metadata.docs.rs]
features = ["serde"]
targets = [
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
bitflags = "2.6"
time = { version = "0.3", features = ["local-offset"] }
log = "0.4"
lru = "0.16"
num-traits = "0.2"
once_cell = "1.17"
png = "0.18"
rand = "0.10"
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = "2.0"
cpal = "0.18.2"
gilrs = "0.11.2"
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"
winit = "0.30"
bytemuck = "1.25.2"
pollster = "1.0.1"
web-time = "1.1.0"
webbrowser = "1.2.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# https://docs.rs/getrandom/latest/getrandom/#webassembly-support
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
rayon = "1.10"
pretty_env_logger = "0.5"

# A `winit` event loop has to be built on the main thread, and the test harness runs every test on
# one it spawned.
[[test]]
name = "pix-engine"
harness = false

[features]
default = []
debug_ui = []
serde = ["dep:serde", "bitflags/serde"]

# Reasonable performance for development
[profile.dev-opt]
inherits = "dev"
opt-level = 1

[profile.test]
inherits = "dev"

[profile.profiling]
inherits = "release"
debug = true

# The profile that 'cargo dist' will build with
[profile.dist]
codegen-units = 1
inherits = "release"
lto = "thin"
strip = "debug"

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.4.0"
# CI backends to support
ci = ["github"]
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
# Publish jobs to run in CI
pr-run-mode = "upload"
